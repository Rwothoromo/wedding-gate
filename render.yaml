# Render Blueprint: one web service + one Postgres database.
# In Render: New > Blueprint > pick this repo. You'll be asked for GATE_PIN and ADMIN_PIN.
services:
  - type: web
    name: wedding-gate
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-gate-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GATE_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
databases:
  - name: wedding-gate-db
    plan: free
